<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sweetest Things Baking Co.</title>
  <meta name="description" content="Sweetest Things Baking Co. is under maintenance. Call 210-541-2826 to order.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div class="frame">
    <div class="stage" id="stage">
      <img class="photo" src="images/hero.jpg" alt="">
      <div class="notice">
        <img class="logo" src="images/logo.png?v=2" alt="">
        <p class="brand">Sweetest Things Baking Co.</p>
        <h1>Under maintenance</h1>
        <p class="note">We’re still baking and taking orders by phone.</p>
        <p class="call">Call to order 210-541-2826</p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var width = 2567;
      var height = 1760;
      function fit() {
        var scale = Math.max(window.innerWidth / width, window.innerHeight / height);
        stage.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
      }
      window.addEventListener("resize", fit);
      fit();
    }());
  </script>
</body>
</html>
